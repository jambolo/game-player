[package]
name = "game-player"
version = "0.3.1"
edition = "2024"
description = "Basic components for implementing an AI player in a two-person game."
authors = ["John Bolton"]

[dependencies]
indextree = "4.7"
rand = { version = "0.10.2", default-features = false, features = ["std", "std_rng"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
analysis_game_tree = ["serde_json"]
analysis_game_state = ["serde_json"]
analysis_transposition_table = ["serde_json"]
debug_game_tree_node_info = []
mcts_random_playout = ["dep:rand"]
